name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.30.3'

jobs:
  build-shared:
    name: Build Shared
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @taku-biyori/shared build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
      - name: Typecheck (backend)
        run: pnpm --filter @taku-biyori/backend typecheck
      - name: Typecheck (frontend)
        run: pnpm --filter @taku-biyori/frontend type-check

  format:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting (shared)
        run: pnpm --filter @taku-biyori/shared format:check
      - name: Check formatting (backend)
        run: pnpm --filter @taku-biyori/backend format:check
      - name: Check formatting (frontend)
        run: pnpm --filter @taku-biyori/frontend format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (shared)
        run: pnpm --filter @taku-biyori/shared lint:check
      - name: Lint (backend)
        run: pnpm --filter @taku-biyori/backend lint:check
      - name: Lint (frontend)
        run: pnpm --filter @taku-biyori/frontend lint:check

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (shared)
        run: pnpm --filter @taku-biyori/shared build
      - name: Build (backend)
        run: pnpm --filter @taku-biyori/backend build
      - name: Build (frontend)
        run: pnpm --filter @taku-biyori/frontend build

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: build-shared
    # リポジトリ層のテストは実 DB に対して走るため PostgreSQL を立てる。
    # ローカル（WSL の PostgreSQL）との違いは TEST_DATABASE_URL の値だけ。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          # POSTGRES_DB は指定しない。テストが実際に繋ぐ taku_biyori_test は
          # 後段の `db:test:setup`（setup-test-database.ts）が作成するため、
          # ここでの初期 DB 名は使われない（postgres イメージは POSTGRES_DB
          # 未指定でも POSTGRES_USER と同名の DB を自動作成する）。
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://app:password@localhost:5432/taku_biyori_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
      # テスト用 DB を作成し、drizzle のマイグレーションを適用する
      - name: Set up test database
        run: pnpm --filter @taku-biyori/backend db:test:setup
      - name: Test (backend)
        run: pnpm --filter @taku-biyori/backend test
      - name: Test (frontend)
        run: pnpm --filter @taku-biyori/frontend test

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    needs: build-shared
    # ブラウザから実 DB に書き込むため、リポジトリ層テストとは別のデータベースを使う。
    # 作成・マイグレーション・シードは playwright の globalSetup が行う。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://app:password@localhost:5432/taku_biyori_e2e
      # シードとバックエンドの起動に必要。e2e の使い捨てセッションにしか使わない
      BETTER_AUTH_SECRET: e2e-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
      - name: Install Playwright browser
        run: pnpm --filter @taku-biyori/frontend exec playwright install --with-deps chromium
      - name: E2E (frontend)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/frontend/playwright-report
          retention-days: 7

  rules:
    name: AI Rules Sync
    runs-on: ubuntu-24.04
    # CLAUDE.md / AGENTS.md / .claude/ は .rulesync/ からの生成物。
    # 直接編集して rulesync generate を忘れたまま push されるのを防ぐ。
    # mcp は対象外。生成先の .mcp.json は gitignore 済みで CI には存在しない。
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated rule files are up to date
        run: pnpm rules:check

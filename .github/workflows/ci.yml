name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.30.3'

jobs:
  build-shared:
    name: Build Shared
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @taku-biyori/shared build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    needs: build-shared
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
      - name: Typecheck (backend)
        run: pnpm --filter @taku-biyori/backend typecheck
      - name: Typecheck (frontend)
        run: pnpm --filter @taku-biyori/frontend type-check

  format:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting (shared)
        run: pnpm --filter @taku-biyori/shared format:check
      - name: Check formatting (backend)
        run: pnpm --filter @taku-biyori/backend format:check
      - name: Check formatting (frontend)
        run: pnpm --filter @taku-biyori/frontend format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (shared)
        run: pnpm --filter @taku-biyori/shared lint:check
      - name: Lint (backend)
        run: pnpm --filter @taku-biyori/backend lint:check
      - name: Lint (frontend)
        run: pnpm --filter @taku-biyori/frontend lint:check
      # UI 移行のガードレール。色は必ず variables.css のトークン経由で参照する
      - name: Check raw color literals (frontend)
        run: pnpm --filter @taku-biyori/frontend check:raw-color

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (shared)
        run: pnpm --filter @taku-biyori/shared build
      - name: Build (backend)
        run: pnpm --filter @taku-biyori/backend build
      - name: Build (frontend)
        run: pnpm --filter @taku-biyori/frontend build

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: build-shared
    # リポジトリ層のテストは実 DB に対して走るため PostgreSQL を立てる。
    # ローカル（WSL の PostgreSQL）との違いは TEST_DATABASE_URL の値だけ。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          # POSTGRES_DB は指定しない。テストが実際に繋ぐ taku_biyori_test は
          # 後段の `db:test:setup`（setup-test-database.ts）が作成するため、
          # ここでの初期 DB 名は使われない（postgres イメージは POSTGRES_DB
          # 未指定でも POSTGRES_USER と同名の DB を自動作成する）。
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://app:password@localhost:5432/taku_biyori_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
      # テスト用 DB を作成し、drizzle のマイグレーションを適用する
      - name: Set up test database
        run: pnpm --filter @taku-biyori/backend db:test:setup
      - name: Test (backend)
        run: pnpm --filter @taku-biyori/backend test
      - name: Test (frontend)
        run: pnpm --filter @taku-biyori/frontend test

  vrt:
    name: VRT (Storybook)
    runs-on: ubuntu-24.04
    needs: build-shared
    # 基準画像はレンダリング環境に依存するため、撮る側（vrt-baseline.yml）と
    # 検証する側でまったく同じイメージを使う。タグは @playwright/test と揃えること。
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check baselines exist
        id: baseline
        run: |
          if [ -n "$(find packages/frontend/vrt/screenshots -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::基準画像が未作成です。vrt-baseline ワークフローを一度実行してください。"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.baseline.outputs.exists == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        if: steps.baseline.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        if: steps.baseline.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: steps.baseline.outputs.exists == 'true'
        with:
          name: shared-dist
          path: packages/shared/dist
      - name: Run VRT
        if: steps.baseline.outputs.exists == 'true'
        run: pnpm --filter @taku-biyori/frontend vrt
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.baseline.outputs.exists == 'true' }}
        with:
          name: vrt-report
          path: |
            packages/frontend/vrt-report
            packages/frontend/vrt-results
          retention-days: 14

name: Deploy Branch-specific API Docs

on:
  push:
    # すべてのブランチ（gh-pagesを除く）へのPushを対象にする
    branches-ignore:
      - 'gh-pages'
    paths:
      - 'docs/openapi.yml'

permissions:
  contents: write # gh-pagesブランチへの書き込み権限が必要

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Get Branch Name
        # スラッシュなどの特殊文字を置換して安全なフォルダ名を取得
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9\-_]/_/g')" >> $GITHUB_ENV

      - name: Build Redoc HTML
        run: |
          mkdir -p output
          redocly build-docs docs/openapi.yml -o output/index.html

      - name: Build Swagger UI HTML
        run: |
          cp docs/openapi.yml output/openapi.yml
          cat > output/swagger.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>taku-biyori API - Swagger UI</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
            <script>
              SwaggerUIBundle({
                url: './openapi.yml',
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
                layout: 'BaseLayout',
              });
            </script>
          </body>
          </html>
          EOF

      # 生成したHTMLを、gh-pagesブランチの「branches/ブランチ名/」配下にだけ反映・プッシュする
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: branches/${{ env.BRANCH_NAME }}
          keep_files: true # 他のブランチのドキュメントを消さずに残す設定

      - name: Output docs URL
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branches/${{ env.BRANCH_NAME }}"
          echo "### API ドキュメント" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| UI | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Redoc | [$BASE_URL/]($BASE_URL/) |" >> $GITHUB_STEP_SUMMARY
          echo "| Swagger UI | [$BASE_URL/swagger.html]($BASE_URL/swagger.html) |" >> $GITHUB_STEP_SUMMARY
